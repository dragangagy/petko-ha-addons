name: Petko Public API
version: "1.0.0"
slug: petko_public
description: Free public HTTPS for Petko games via ngrok (no domain needed)
url: https://github.com/dragangagy/petko-ha-addons
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: true
options:
  ngrok_authtoken: ""
  ngrok_domain: ""
schema:
  ngrok_authtoken: str
  ngrok_domain: str
build:
  amd64: Dockerfile
