worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;

    map $request_method $cors_preflight {
        default 0;
        OPTIONS 1;
    }

    server {
        listen 127.0.0.1:3099;

        location /en/ {
            if ($cors_preflight) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Headers "authorization,apikey,content-type,prefer,x-client-info,ngrok-skip-browser-warning" always;
                add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
                return 204;
            }
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Expose-Headers "Content-Range" always;
            proxy_pass http://127.0.0.1:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /sr/ {
            if ($cors_preflight) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Headers "authorization,apikey,content-type,prefer,x-client-info,ngrok-skip-browser-warning" always;
                add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
                return 204;
            }
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Expose-Headers "Content-Range" always;
            proxy_pass http://127.0.0.1:3001/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = / {
            return 200 'Petko API proxy: /en/ (Word Quest) /sr/ (SR)\n';
            add_header Content-Type text/plain;
        }
    }
}
