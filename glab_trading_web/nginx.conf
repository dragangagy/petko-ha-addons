worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    server {
        listen 3010;
        server_name _;
        root /www;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
