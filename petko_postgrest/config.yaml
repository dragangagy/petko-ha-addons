name: Petko PostgREST (EN)
version: "1.3.4"
slug: petko_postgrest
description: Supabase-compatible REST API for Petko Word Quest (English)
url: https://github.com/dragangagy/petko-ha-addons
arch:
  - amd64
startup: application
boot: auto
init: false
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: PostgREST API for Petko Word Quest EN
options:
  db_name: petko_en
  postgres_password: homeassistant
  jwt_secret: petko-local-jwt-secret-at-least-32-characters
schema:
  db_name: str
  postgres_password: password
  jwt_secret: password
build:
  amd64: Dockerfile
