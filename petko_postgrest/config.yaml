name: Petko PostgREST (EN)
version: "1.3.0"
slug: petko_postgrest
description: Supabase-compatible REST API for Petko Word Quest (English)
url: https://github.com/dragangagy/petko-ha-addons
arch:
  - amd64
startup: application
boot: auto
init: false
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: PostgREST API — Petko Word Quest (EN, db petko_en)
image: postgrest/postgrest:v12.2.3
environment:
  PGRST_DB_URI: postgresql://authenticator:homeassistant@db21ed7f-postgres-latest:5432/petko_en?sslmode=disable
  PGRST_DB_SCHEMAS: public
  PGRST_DB_ANON_ROLE: anon
  PGRST_JWT_SECRET: petko-local-jwt-secret-at-least-32-characters
  PGRST_SERVER_PORT: "3000"
