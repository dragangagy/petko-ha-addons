name: Petko PostgREST (SR)
version: "1.0.6"
slug: petko_postgrest_sr
description: Supabase-compatible REST API for Petko (srpska verzija)
url: https://github.com/dragangagy/petko-ha-addons
arch:
  - amd64
startup: application
boot: auto
init: false
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: PostgREST API for Petko SR
options:
  db_name: petko_sr
  postgres_password: homeassistant
  jwt_secret: petko-local-jwt-secret-at-least-32-characters
schema:
  db_name: str
  postgres_password: password
  jwt_secret: password
build:
  amd64: Dockerfile
